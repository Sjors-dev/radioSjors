# ===========================================================================
# AI Radio configuration.  Secrets live in .env, everything else lives here.
# Paths may be absolute, or relative to the project root.
# ===========================================================================

paths:
  library: library          # music files (mp3) -- liquidsoap reads this
  banned: banned            # banned tracks are MOVED here, not deleted
  queue: queue              # rendered patter audio
  state: state              # sqlite db + now_playing.txt
  logs: logs

station:
  name: "Radio Sjors"
  description: "AI-programmed personal radio"
  genre: "Various"
  # Bitrate for the mp3 sent to caster.fm. 128 is plenty and cheap on a Celeron.
  bitrate: 128
  samplerate: 44100

dj:
  # Station-level voice, injected verbatim into every planning prompt. The
  # individual hosts are described under `hosts` below, so keep this about the
  # station rather than about one person.
  persona: |
    This is a small private internet radio station with exactly one listener.
    The hosts are warm, dry and a little wry, and they never oversell. They
    talk like late-night radio people who actually like the music: short
    thoughts, concrete details, no radio-cliche hype, no "coming up next on
    the hottest hits". They never mention that they are AI, and they never
    mention traffic, phone numbers, sponsors or contests, because this station
    has none of those.

  # Two hosts. The first one leads; the second turns up for the occasional
  # conversation. Delete the second entry to go back to a single voice --
  # everything else adapts on its own.
  #
  # voice_model: leave blank on the first host to inherit tts.voice_model
  # below. Leave blank on the second and the co-host voice is looked for right
  # next to the first one, which is where install.sh puts it. A host whose
  # model is not on disk is silently left out of the show rather than being
  # read in somebody else's voice.
  #
  # edge_voice: only read when tts.engine: edge_tts. Unlike voice_model there
  # is no sibling file to guess a second one from, so a co-host needs their
  # own edge_voice set explicitly or they just use the piper fallback.
  hosts:
    - name: Ray
      character: >
        Dry, unhurried, has heard all of it before. Hands you a record rather
        than selling it to you. Still sounds like he means it, not bored --
        dry is a tone of voice, not a flat one.
      voice_model: ""
      edge_voice: ""
      length_scale:
      # A small lift off Piper's stock values (0.667 / 0.8) -- see tts.noise_*
      # above. Ray stays understated on purpose, so this is modest.
      noise_scale: 0.70
      noise_w: 0.85
    - name: Nina
      character: >
        Quicker, more curious, happy to push back. Asks the question the
        listener would ask, and does not always agree with Ray. Genuinely
        into the music -- sounds like it. Reads as someone leaning forward,
        not reading off a card: real enthusiasm, an actual laugh in her
        voice sometimes, sentences that speed up when she means it.
      voice_model: ""
      edge_voice: ""
      length_scale:
      # More lift than Ray's -- she is the more animated of the two. Tune by
      # ear: too high starts sounding rough rather than lively.
      noise_scale: 0.90
      noise_w: 1.00

  language: english         # english | dutch  (must match the Piper voice below)
  # A spoken item is inserted before every Nth track. 1 = before every track.
  patter_every_n_tracks: 2
  # Always open a block with a line (time-of-day greeting / show framing).
  patter_at_block_start: true
  # Soft cap on an ordinary link, so Piper renders fast on a weak CPU.
  max_patter_words: 45
  # Ceiling for the longer items -- a weather moment, a music note, or a whole
  # two-host conversation. This number is what "talks a bit more" means.
  max_segment_words: 90
  # Silence between one host finishing and the other starting. Without a beat
  # here two voices run together and sound like one person changing timbre.
  turn_gap_seconds: 0.35

  # How much extra talk an hour gets, on top of the usual short links. Each
  # number is rolled fresh every hour inside its [low, high] range, and that
  # is the point: a station that always does exactly one weather slot and two
  # chats is just a longer format, not a looser one. Set both ends the same to
  # fix a value, or [0, 0] to switch something off.
  segments:
    banter_per_block: [0, 2]        # two-host conversations per hour
    banter_turns: [4, 6]            # how many turns each conversation runs
    music_notes_per_block: [0, 2]   # "one true thing about this record"
    # Chance that an hour mentions the weather at all.
    weather_chance: 0.5
    # Hours [start, end) where the weather moment covers the day ahead rather
    # than only the conditions outside right now.
    weather_outlook_hours: [5, 11]

tts:
  # piper_cli      -> the `piper` executable on PATH (recommended)
  # piper_python   -> `python -m piper` from the piper-tts pip package
  # espeak         -> espeak-ng; ugly but runs on literally any CPU
  # edge_tts       -> Microsoft Edge's free neural voices (the `edge-tts`
  #                   package). Genuinely more expressive than Piper and
  #                   still free, but it is an unofficial endpoint reached
  #                   over the network -- no key, no SLA, could be blocked
  #                   or rate-limited without warning. Needs ffmpeg (it only
  #                   speaks mp3) and every host still needs voice_model
  #                   below set, because that is the fallback used whenever
  #                   edge-tts is unreachable for a given line.
  # none           -> disable patter entirely (music only)
  engine: piper_cli
  # Path to the .onnx voice model. install.sh downloads this one. Also used
  # as the piper fallback when engine: edge_tts.
  voice_model: /opt/ai-radio/voices/en_US-amy-medium.onnx
  # Piper speed; 1.0 = normal, higher = slower. Stay near 1.0: slowing the
  # voice down does not make it sound more natural, it sounds sedated.
  # Natural pacing comes from short sentences and the pause below.
  length_scale: 1.05
  # Seconds of silence after each sentence. 0.3-0.5 reads like someone
  # taking a breath; this is the single biggest win for sounding human.
  sentence_silence: 0.4
  # Piper's own expressiveness knobs (straight from the underlying VITS
  # model, nothing custom). noise_scale varies the acoustic generation --
  # higher sounds more alive, push it too far and it gets rough/unstable.
  # noise_w varies phoneme duration -- higher reads less metronomic, more
  # human. Both default to Piper's own stock values (0.667 / 0.8) and are
  # worth tuning per host below rather than here; there is a real ceiling
  # on how expressive a small offline model can sound regardless of these,
  # so treat them as a genuine but modest lever, not a fix for monotone
  # delivery on their own.
  noise_scale: 0.667
  noise_w: 0.8
  # Only read when engine: edge_tts. Voice id from `edge-tts --list-voices`,
  # e.g. en-US-AriaNeural, en-GB-RyanNeural -- pick per host below instead
  # for two different voices; this is just the station-wide default (host 1
  # only, mirrors voice_model). rate/pitch are edge-tts's own nudge syntax,
  # "+0%"/"+0Hz" for stock delivery.
  edge_voice: ""
  edge_rate: "+0%"
  edge_pitch: "+0Hz"
  # Only read when engine: edge_tts. Which piper flavour a failed edge-tts
  # request falls back to for that one line.
  fallback_engine: piper_cli
  # Normalise patter loudness to roughly match music (needs ffmpeg).
  loudnorm: true
  # Give up on a render after this many seconds (Celeron safety valve).
  timeout_seconds: 180

weather:
  # Open-Meteo: free, no API key, no account, no bill. That is the whole
  # reason the hosts are allowed to talk about the weather at all.
  enabled: true
  place_name: "Eindhoven"
  latitude: 51.4416
  longitude: 5.4697
  timezone: "Europe/Amsterdam"
  # The station plans an hour ahead anyway, so a reading this old is fine.
  cache_minutes: 30
  timeout_seconds: 10

site:
  # Publishes now-playing and the queue to a secret GitHub Gist, which the
  # Vercel site under site/ reads. Free, and no new account: you already have
  # GitHub. Needs GITHUB_TOKEN (scope: gist) and SITE_GIST_ID in .env.
  enabled: false
  publish_interval_seconds: 20
  # How much of the queue and the history the site is allowed to show.
  queue_length: 8
  history_length: 12
  # Key inside the gist. Only change it if you also change the site.
  filename: "radio.json"

planner:
  # Target length of one planned block, in minutes.
  block_minutes: 60
  # Keep at least this many minutes of ready-to-play audio queued ahead.
  buffer_minutes: 60
  # Don't repeat a track that played within this many hours.
  repeat_cooldown_hours: 8
  # Don't play the same artist twice within this many tracks. Enforced in the
  # fallback planner, and instructed to the LLM in the planning prompt.
  artist_spacing: 4
  # Cap tracks per artist in the pool offered to the LLM, so it cannot
  # programme an artist back-to-back just because that is what it was given.
  # 0 = work it out from the pool size and how many artists are available.
  max_per_artist_in_pool: 0
  # How many candidates to offer the LLM per block (keeps the prompt small).
  candidate_pool: 60
  # When you name an artist in chat ("in the mood for some Westside Gunn")
  # this many of their tracks are put in front of the planner, ignoring the
  # energy band and the repeat cooldown. Asking for someone by name should
  # actually get you them.
  focus_artist_tracks: 10
  # Artists named in a mood_map entry ("think Smashing Pumpkins,
  # Radiohead") are illustrations of a genre rather than a running order,
  # so only a few of each are added -- enough to be pickable.
  exemplar_artist_tracks: 3
  # Hour ranges are [start, end) in 24h local time and must cover 0-23.
  # `genres:` on an entry (optional) narrows the candidate pool to tracks
  # whose stored genre/tags contain any of the listed words BEFORE energy is
  # even considered -- energy alone cannot tell a soft rock hour from a jazz
  # one at the same tempo, and without this the model is just handed a
  # random slice of the whole library and has to guess genre from the mood
  # text alone. Loose substring matching against whatever Last.fm tagged the
  # track with at download time, so "rock" also matches "alternative rock"
  # or "90s rock" -- no need to list every variant. Leave it out on an entry
  # and that hour works exactly as before (energy and mood text only). If
  # too few tracks in the library match yet, the filter is skipped for that
  # hour rather than starving it -- check the brain log for "widening past
  # genre" to see when that happens; it means more of that genre needs
  # downloading, or the words here need to match your library's actual tags
  # (`main.py plan --dry-run` shows each candidate's tags).
  mood_map:
    - hours: [0, 5]
      name: "late night"
      mood: "slow, Atmospheric rap: just some rap music to vibe on. Nothing too hard or rage rap like"
      energy: [1, 2]
      genres: [rap, hip hop]
    - hours: [5, 10]
      name: "morning"
      mood: "Soft Rock music. think smashing pumpkins, radiohead, and other artists like this. Nothing too hard, just some morning tunes."
      energy: [2, 3]
      genres: [rock, alternative, indie]
    - hours: [9, 12]
      name: "late morning"
      mood: "Chill Rap to focus/study too. Think Kanye West, Kendrick lamar, Lil Yachty, and other artists like this. Music that gives you focus but still gives that morning chill."
      energy: [2, 4]
      genres: [rap, hip hop]
    - hours: [12, 14]
      name: "midday"
      mood: "Upbeat hard rap. This should give me energy to go through to the day. Make me bop my head. Can be quite energetic "
      energy: [3, 4]
      genres: [rap, hip hop]
    - hours: [14, 16]
      name: "afternoon"
      mood: "Upbeat hard rap. This should give me energy to go through to the day. Make me bop my head. Can be quite energetic"
      energy: [3, 4]
      genres: [rap, hip hop]
    - hours: [16, 20]
      name: "evening"
      mood: "Jazz music to relax too. This can be quite slow viby jazz music. I want to hear this after a long day"
      energy: [2, 4]
      genres: [jazz]
    - hours: [20, 24]
      name: "night"
      mood: "Nightly viby Rap music. Make it Atmospheric, night vibes. Can be a little energetic"
      energy: [2, 3]
      genres: [rap, hip hop]

llm:
  # Failover order. First provider that answers wins; 429/5xx falls through.
  providers: [gemini, groq]
  # Both providers retire models regularly. If you get a 404, list what your
  # key can actually reach:
  #   curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$KEY"
  #   curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $KEY"
  gemini_model: gemini-3.6-flash
  groq_model: openai/gpt-oss-120b
  timeout_seconds: 60
  max_retries: 2
  # Completion token budgets per job.
  # Reasoning models (Gemini 3.x, Groq's gpt-oss) burn part of this on thinking
  # before any text is produced, so a budget that looks generous for the visible
  # answer can come back completely empty. If you see "empty reply
  # (finishReason=MAX_TOKENS)" in the logs, raise the matching number here.
  max_tokens:
    plan: 8000       # the hourly running order plus all its patter
    tag: 6000        # mood/energy labelling of new tracks
    intent: 2048     # classifying one chat message
    probe: 2048      # the liveness check in `main.py doctor`

discovery:
  # Seeds used to bootstrap an empty library and to keep it growing.
  # Put in artists you actually like -- everything else grows from these.
  seed_artists:
    - "Travis Scott"
    - "Kanye West"
    - "Kendrick Lamar"
    - "Yeat"
    - "Playboi Carti"
    - "Don Toliver"
    - "Lil Yachty"
    - "A$AP Rocky"
    - "MF DOOM"
    - "Sor"
    - "The Smashing Pumpkins"
    - "RadioHead"
    - "Foo Fighters"
    - "Nirvana"
    - "The Cure"
    - "Louis Armstrong"
    - ""
  # New tracks fetched per hour in the background. Raise it while you are
  # filling the library out, then drop it back so the station is not
  # constantly downloading on two cores.
  downloads_per_hour: 3
  # Hard floor between downloads regardless of the rate above, so a big
  # number cannot starve the stream. Lower it for a fast bulk fill.
  min_download_gap_seconds: 120
  # How many tracks to take from any one artist PER DISCOVERY PASS. This is
  # not a library limit -- an artist still builds up over many passes. Small
  # is right here: two or three from many artists grows a station, eight from
  # one just fills the library with that artist.
  tracks_per_artist: 3
  # Ceiling on tracks by one artist in the library, for artists the station
  # discovered on its own. Stops a Last.fm neighbour crowding everything out.
  max_tracks_per_artist: 8
  # The ceiling for artists YOU named in seed_artists above. Much higher on
  # purpose: the cap exists to stop one name taking over, not to ration the
  # artists you actually like. Add an artist to seed_artists to say
  # "more of this one, please".
  max_tracks_per_seed_artist: 30
  # Stop growing once the library is this big (0 = no cap).
  library_target: 1200
  # Minimum tracks before the planner bothers with AI programming.
  min_tracks_to_program: 25

downloader:
  # Accept a result only if its duration is within this fraction of the
  # duration Last.fm reports.  Ignored when Last.fm has no duration.
  duration_tolerance: 0.25
  min_duration_seconds: 75
  max_duration_seconds: 900
  # How many yt-dlp search results to consider per track.
  search_results: 8
  audio_quality: "0"        # yt-dlp/LAME VBR quality, 0 = best
  # Substrings that disqualify a candidate title (case-insensitive).
  reject_title_patterns:
    - live
    - concert
    - nightcore
    - sped up
    - speed up
    - slowed
    - reverb
    - 8d audio
    - remix
    - bootleg
    - mashup
    - cover
    - karaoke
    - instrumental
    - tribute
    - "1 hour"
    - "one hour"
    - "10 hours"
    - loop
    - full album
    - "reaction"
    - lyrics video
    - mix
    - megamix
    - dj set
    - extended
    - tutorial
  # Channels containing these get a strong preference (official audio).
  prefer_channel_patterns:
    - " - topic"
    - "vevo"
    - "official"

stream:
  # Liquidsoap's local telnet control socket. Never expose this off-box.
  telnet_host: "127.0.0.1"
  telnet_port: 1234
  # How many items to keep pushed into liquidsoap's own queue.
  liquidsoap_queue_depth: 4
  crossfade_seconds: 2.0

bot:
  # Reply in chat when a request is accepted/queued.
  confirm_requests: true
  # On a vibe shift, throw away the unplayed part of the current block and
  # plan a fresh one immediately. false = the change waits for the next hour.
  replan_on_vibe: true
  # Refuse to download anything longer than this for a chat request (minutes).
  max_request_minutes: 12
  # When a chat message names an artist (a mood like "in the mood for some
  # Westside Gunn", or "play some Westside Gunn" with no specific song) and
  # the library has fewer than this many of their tracks, fetch a few more
  # from Last.fm right then -- so the request actually means something,
  # instead of the one track we happen to have looping.
  min_tracks_for_request: 4
  # How long that on-demand fetch is allowed to run before giving up with
  # whatever it has. Bounded on purpose: a chat reply should not sit for
  # minutes waiting on someone's whole discography.
  backfill_budget_seconds: 60

runner:
  # Main loop tick, seconds.
  tick_seconds: 5
  # How often to consider a background download, seconds.
  download_interval_seconds: 1200
  # How often to re-tag untagged tracks with mood/energy via the LLM, seconds.
  enrich_interval_seconds: 900
